[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dalwiki-client"
version = "0.3.0"
description = "Shared dal.wiki API v2 client + botkit (sync/run/llm/discord) for the dal.wiki bot ecosystem."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "holidays>=0.100",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
]

# ingest = LLM 구조화(비-mock) 시 필요: pip install -e .[ingest]
# llm     = botkit.llm (Claude 호출 + 이미지 축소): pip install -e .[llm]
# discord = botkit.discord catchup:                 pip install -e .[discord]
[project.optional-dependencies]
ingest = ["anthropic>=0.40"]
llm = ["anthropic>=0.40", "Pillow>=10"]
discord = ["discord.py>=2.3"]
dev = ["pytest>=7", "anthropic>=0.40", "Pillow>=10", "discord.py>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
